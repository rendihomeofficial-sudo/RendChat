name: messenger_app
description: "Production-grade Firebase Messenger App in Flutter"
publish_to: 'none'
version: 1.3.5+18

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter

  # Firebase Suite
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_storage: ^12.3.2
  firebase_messaging: ^15.1.3

  # Authentication
  google_sign_in: 7.2.0

  # State Management & Helpers
  provider: ^6.1.2
  intl: ^0.19.0
  uuid: ^4.5.1
  cached_network_image: ^3.4.1

  # Media
  image_picker: ^1.1.2

  # UI & Icons
  cupertino_icons: ^1.0.8
  file_picker: ^13.3.0
  url_launcher: ^6.3.3
  http: 1.6.0
  package_info_plus: 10.2.2
  shared_preferences: ^2.5.6
  record: ^7.1.2
  audioplayers: ^6.8.1
  path_provider: ^2.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
